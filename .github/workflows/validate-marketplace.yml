name: Validate source-managed marketplace plugins
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/checkout-release-plugins.mjs --all
      - run: python scripts/sync-aggregated-packages.py
      - run: node scripts/build-local-marketplace.mjs
      - run: node scripts/sync-marketplaces.mjs --catalog-only
      - run: node scripts/sync-marketplaces.mjs --remote --locale=zh-CN --source-only --plugin=ui-design --plugin=1panel --plugin=gitguard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test scripts/tests/sync-marketplaces.test.mjs
