# DSH bundle for the repository-root package.
- insert:
    - id: processon-design-plugin
      name: 'processon-design'

    - id: mcp-processon-design-processon
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.DSH_MCP_PROCESSON_DESIGN"
      config:
        serverName: "processon"
        toolCallTimeoutMs: 60000
        transport: 'stdio'
        command: "python3"
        cwd: !!js "(() => { const p = process.getBuiltinModule('node:path'); const req = process.getBuiltinModule('node:module').createRequire(baseUrl); return p.dirname(req.resolve('processon-design/package.json')) })()"
        args:
          - "./scripts/processon_mcp_proxy.py"
        env:
          CLAUDE_PLUGIN_ROOT: !!js "(() => { const p = process.getBuiltinModule('node:path'); const req = process.getBuiltinModule('node:module').createRequire(baseUrl); return p.dirname(req.resolve('processon-design/package.json')) })()"
          PLUGIN_ROOT: !!js "(() => { const p = process.getBuiltinModule('node:path'); const req = process.getBuiltinModule('node:module').createRequire(baseUrl); return p.dirname(req.resolve('processon-design/package.json')) })()"
          PLUGIN_DATA: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'plugin-data', \"processon-design\")"
